# Deployment descriptor for Coolify.
#
# Three containers, where the previous deployment ran seven. That is deliberate.
#
# CONTAINER_ROLE selects the workload. Each role copies its own supervisor
# config in before starting supervisord, so a role starts its programs and no
# others. The `worker` role exists for this topology: it carries the queue
# workers, the scheduler and the order regularizer together, which is what one
# background container has to run when there is only one.
#
# It used to be `queue`, back when supervisord.conf declared every program and
# any role started all of them. That is no longer true, and a `queue` container
# here would run queue workers and nothing else: no scheduler, so no backups
# and no scheduled task at all.
#
# Two roles do not exec supervisord and still need their own container:
#   app    - nginx and php-fpm, listening on 80
#   reverb - artisan reverb:start, listening on 8080 inside the container
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    networks:
      - csl-shared-network

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: reverb
    # Reverb listens on 8080 inside and has always been published as 8085.
    # certificationnotify.csl-brands.com proxies to it, and returns 404 to a
    # plain GET by design: it only answers websocket upgrades at /app/{key}.
    ports:
      - "${REVERB_HOST_PORT:-8085}:8080"
    networks:
      - csl-shared-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: worker
    # The image healthcheck curls a web port this container does not serve, so
    # check the work instead. Not supervisord itself: it stays up and reports
    # healthy with zero programs configured, which is exactly how this container
    # ran for nine days without a queue worker or a scheduler.
    #
    # The bracketed first letter keeps the pattern from matching the shell that
    # runs this check: its own command line contains the literal "[q]ueue:work",
    # which the regex does not match.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan [q]ueue:work' >/dev/null && pgrep -f 'artisan [s]chedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - csl-shared-network

networks:
  # Owned by the CSL-DevOps stack, which holds csl-mysql-certification and
  # csl-kafka. External means join it, never create it.
  csl-shared-network:
    external: true
