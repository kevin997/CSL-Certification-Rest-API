# Deployment descriptor for Coolify.
#
# Three application roles, plus an isolated, no-public-port academy WhatsApp gateway.
#
# CONTAINER_ROLE selects the workload. Each role copies its own supervisor
# config in before starting supervisord, so a role starts its programs and no
# others. The `worker` role exists for this topology: it carries the queue
# workers, the scheduler and the order regularizer together, which is what one
# background container has to run when there is only one.
#
# It used to be `queue`, back when supervisord.conf declared every program and
# any role started all of them. That is no longer true, and a `queue` container
# here would run queue workers and nothing else: no scheduler, so no backups
# and no scheduled task at all.
#
# Two roles do not exec supervisord and still need their own container:
#   app    - nginx and php-fpm, listening on 80
#   reverb - artisan reverb:start, listening on 8080 inside the container
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
      # Keep licence gates active on redeploy; explicit environment values can override.
      LICENSING_ENFORCEMENT_ENABLED: ${LICENSING_ENFORCEMENT_ENABLED:-true}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-kursa}
      WAHA_TENANT_ENABLED: ${WAHA_TENANT_ENABLED:-true}
      WAHA_TENANT_BASE_URL: http://academy-gateway:3000
      WAHA_TENANT_API_KEY_FILE: /run/secrets/academy_whatsapp_key
      WAHA_TENANT_PILOT_ENVIRONMENT_ID: "15"
    secrets:
      - academy_whatsapp_key
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    networks:
      - csl-shared-network
      - academy-wa-private

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: reverb
      # Keep licence gates active on redeploy; explicit environment values can override.
      LICENSING_ENFORCEMENT_ENABLED: ${LICENSING_ENFORCEMENT_ENABLED:-true}
    # Reverb listens on 8080 inside and has always been published as 8085.
    # certificationnotify.csl-brands.com proxies to it, and returns 404 to a
    # plain GET by design: it only answers websocket upgrades at /app/{key}.
    ports:
      - "${REVERB_HOST_PORT:-8085}:8080"
    # The image healthcheck curls http://localhost:80/health/index.php — the web
    # container's check, inherited by a container that serves no web port. It has
    # therefore reported unhealthy since the day this service was created, while
    # Reverb ran perfectly: the log says "Starting server on 0.0.0.0:8080" and
    # 8080 answers. A container that is permanently red teaches everyone to
    # ignore the alert, which is the state in which a real outage goes unread —
    # and it pages somebody every time the container is recreated.
    #
    # What is checked is the only thing that matters here: the websocket server
    # accepts a connection. Not an HTTP status — Reverb answers a plain GET with
    # 404 by design, so `curl -f` would fail against a working server.
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080, $$e, $$s, 3) ? 0 : 1);'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - csl-shared-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: worker
      # Keep licence gates active on redeploy; explicit environment values can override.
      LICENSING_ENFORCEMENT_ENABLED: ${LICENSING_ENFORCEMENT_ENABLED:-true}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-kursa}
      WAHA_TENANT_ENABLED: ${WAHA_TENANT_ENABLED:-true}
      WAHA_TENANT_BASE_URL: http://academy-gateway:3000
      WAHA_TENANT_API_KEY_FILE: /run/secrets/academy_whatsapp_key
      WAHA_TENANT_PILOT_ENVIRONMENT_ID: "15"
    secrets:
      - academy_whatsapp_key
    # The image healthcheck curls a web port this container does not serve, so
    # check the work instead. Not supervisord itself: it stays up and reports
    # healthy with zero programs configured, which is exactly how this container
    # ran for nine days without a queue worker or a scheduler.
    #
    # The bracketed first letter keeps the pattern from matching the shell that
    # runs this check: its own command line contains the literal "[q]ueue:work",
    # which the regex does not match.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan [q]ueue:work' >/dev/null && pgrep -f 'artisan [s]chedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - csl-shared-network
      - academy-wa-private

  academy-gateway:
    image: devlikeapro/waha@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    restart: unless-stopped
    labels:
      traefik.enable: "false"
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_RUN_XVFB: "false"
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_EVENTS_DOWNLOAD_MEDIA: "false"
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "-ec"]
    command:
      - |
        export WAHA_API_KEY="$$(cat /run/secrets/academy_whatsapp_key)"
        test "$${#WAHA_API_KEY}" -eq 64
        exec /entrypoint.sh
    secrets:
      - academy_whatsapp_key
    volumes:
      - academy-whatsapp-sessions:/app/.sessions
    networks:
      - academy-wa-private
    healthcheck:
      test: ["CMD", "node", "-e", "const k=require('fs').readFileSync('/run/secrets/academy_whatsapp_key','utf8').trim();fetch('http://127.0.0.1:3000/api/version',{headers:{'X-Api-Key':k},signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 25s
      timeout: 7s
      start_period: 90s
      retries: 3
    mem_limit: 1536m
    cpus: 1.5

networks:
  # Owned by the CSL-DevOps stack, which holds csl-mysql-certification and
  # csl-kafka. External means join it, never create it.
  csl-shared-network:
    external: true

  # A private bridge for just the gateway and its callers. Keep outbound access
  # for WhatsApp, but do not attach the gateway to proxy or shared service nets.
  academy-wa-private:
    driver: bridge

volumes:
  academy-whatsapp-sessions:

secrets:
  academy_whatsapp_key:
    file: /opt/kursa-academy-whatsapp/api-key
